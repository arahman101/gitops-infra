apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}

          command:
            - "sh"
            - "-c"

          ports:
            - containerPort: {{ .Values.redis.port }}

          args:
            - 'redis-server --requirepass "$REDIS_PASSWORD"'

          env:
            - name: REDIS_PASSWORD 
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret.targetSecretName }}
                  key: REDIS_PASSWORD